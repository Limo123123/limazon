<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/themes/js/config.js"></script>
    <script src="/themes/js/security.js"></script>
    <script src="/themes/js/limo-global.js" data-page="reset-password"></script>

    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen - Limazon</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
        }

        .glass-panel {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pattern-grid {
            background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .input-glow {
            transition: all 0.3s ease;
        }

        .input-glow:focus {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(17, 24, 39, 0.9);
        }
    </style>
</head>
<body class="min-h-screen selection:bg-blue-500 selection:text-white flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Hintergrund-Effekte wie auf der Index -->
    <div class="absolute inset-0 z-[-1]" id="bgEffects">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute inset-0 pattern-grid opacity-20"></div>
    </div>

    <!-- Reset Card -->
    <div class="glass-panel p-8 rounded-3xl max-w-md w-full border border-blue-500/30 shadow-[0_0_50px_rgba(59,130,246,0.15)] relative overflow-hidden text-center">
        
        <div class="mb-6">
            <h1 class="text-3xl font-black tracking-tighter mb-2">Limazon<span class="text-blue-500">.</span></h1>
            <p id="accountInfo" class="text-gray-400 text-sm">Neues Passwort vergeben</p>
        </div>

        <!-- Nachrichten-Box -->
        <div id="resetMessage" class="hidden mb-4 p-3 rounded-xl text-sm font-medium text-center border"></div>

        <!-- Formular -->
        <div id="formContainer" class="space-y-4">
            <div>
                <input type="password" id="newPassword" placeholder="Neues Passwort (Min. 6 Zeichen)"
                    class="w-full px-4 py-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white input-glow focus:outline-none">
            </div>
            <button type="button" onclick="submitNewPassword()" id="submitBtn"
                class="w-full py-4 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition-all active:scale-95 shadow-[0_0_20px_rgba(59,130,246,0.4)]">
                Passwort speichern
            </button>
        </div>

        <div class="mt-6">
            <a href="/" class="text-xs text-gray-500 hover:text-gray-300 underline">Zurück zum Login</a>
        </div>
    </div>

    <script>
        // --- MULTI-TENANCY API CONFIG ---
        const API_URL = window.LIMO_API;

        // URL Parameter auslesen (?token=XYZ&username=ABC)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const username = urlParams.get('username');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token || !username) {
                document.getElementById('formContainer').style.display = 'none';
                showMsg("Ungültiger oder unvollständiger Reset-Link.", true);
            } else {
                document.getElementById('accountInfo').textContent = `Account: ${username}`;
            }
        });

        async function submitNewPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const btn = document.getElementById('submitBtn');

            if (!newPassword || newPassword.length < 6) {
                showMsg("Das Passwort muss mindestens 6 Zeichen lang sein.", true);
                return;
            }

            btn.disabled = true;
            btn.textContent = "Wird gespeichert...";

            try {
                const res = await fetch(`${API_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, token, newPassword }),
                    credentials: 'include' // Wichtig für Sessions
                });

                const data = await res.json();

                if (res.ok) {
                    showMsg(data.message || "Passwort erfolgreich geändert!", false);
                    document.getElementById('formContainer').style.display = 'none';
                } else {
                    showMsg(data.error || "Fehler beim Zurücksetzen.", true);
                    btn.disabled = false;
                    btn.textContent = "Passwort speichern";
                }
            } catch (err) {
                showMsg("Netzwerkfehler. Bitte versuche es später erneut.", true);
                btn.disabled = false;
                btn.textContent = "Passwort speichern";
            }
        }

        function showMsg(text, isError) {
            const msgBox = document.getElementById('resetMessage');
            msgBox.textContent = text;
            msgBox.classList.remove('hidden', 'bg-red-500/20', 'border-red-500/50', 'text-red-400', 'bg-green-500/20', 'border-green-500/50', 'text-green-400');

            if (isError) {
                msgBox.classList.add('bg-red-500/20', 'border-red-500/50', 'text-red-400');
            } else {
                msgBox.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-400');
            }
        }
    </script>
</body>
</html>
