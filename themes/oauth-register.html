<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limazon - Setup Account</title>
    <script src="/themes/js/config.js?v=1"></script>
    <script src="/themes/js/security.js?v=1"></script>
    <script src="/themes/js/limo-global.js?v=1" data-page="index"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; }
        .glass-panel { background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(59, 130, 246, 0.2); }
        .input-glow:focus { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); border-color: rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-blue-500 selection:text-white">

    <div class="glass-panel p-8 rounded-3xl max-w-md w-full shadow-[0_0_50px_rgba(59,130,246,0.15)] relative overflow-hidden">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-tighter mb-2">Fast geschafft<span class="text-blue-500">!</span></h1>
            <p class="text-gray-400 text-sm">Dein Account wurde autorisiert. Wähle nun deinen Alias und gib den Einladungscode ein.</p>
        </div>

        <div id="errorMessage" class="hidden mb-4 p-3 rounded-xl text-sm font-medium text-center border bg-red-500/20 border-red-500/50 text-red-400"></div>

        <form id="finishSetupForm" onsubmit="completeRegistration(event)" class="space-y-4">
            
            <div>
                <label class="text-xs text-gray-400 mb-1 block uppercase font-bold tracking-wider">Wunschname</label>
                <input type="text" id="regUsername" required placeholder="z.B. PlayerOne"
                    class="w-full px-4 py-3 bg-gray-900/50 border border-gray-700 rounded-xl text-white input-glow focus:outline-none">
            </div>

            <div>
                <label class="text-xs text-gray-400 mb-1 block uppercase font-bold tracking-wider mt-4">Invite Code</label>
                <input type="text" id="regInviteCode" required placeholder="INV-..."
                    class="w-full px-4 py-3 bg-gray-900/50 border border-blue-500/50 rounded-xl text-white input-glow focus:outline-none"
                    style="box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.1);">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full mt-6 py-4 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition-all active:scale-95 shadow-[0_0_20px_rgba(59,130,246,0.4)]">
                Account erstellen
            </button>
        </form>

    </div>

    <script>
        async function completeRegistration(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorMessage');
            
            btn.disabled = true;
            btn.textContent = "Erstelle Account...";
            errorBox.classList.add('hidden');

            const payload = {
                username: document.getElementById('regUsername').value,
                inviteCode: document.getElementById('regInviteCode').value
            };

            try {
                const res = await fetch(`${window.LIMO_API}/api/auth/oauth-complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'include'
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = '../index.html'; // Ab ins Dashboard!
                } else {
                    errorBox.textContent = data.message || data.error || "Fehler beim Erstellen.";
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = "Netzwerkfehler.";
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = "Account erstellen";
            }
        }
    </script>
</body>
</html>
