<!DOCTYPE html>
<html lang="de">

<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/themes/js/config.js?v=1789479050"></script>
    <script src="/themes/js/security.js?v=1789479050"></script>
    <script src="/themes/js/limo-global.js?v=1789479050" data-page="limterest"></script>
    <meta name="robots" content="index, follow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limterest 2.0 ✨</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1f1f1f;
            --surface-hover: #2a2a2a;
            --primary: #e60023;
            --text: #ffffff;
            --text-sec: #888888;
            --radius: 24px;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-top: 80px;
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.5rem;
            margin-right: 20px;
            cursor: pointer;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--surface);
            border: none;
            padding: 12px 20px;
            border-radius: 99px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .nav-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 99px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-danger {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border: none;
            padding: 8px 16px;
            border-radius: 99px;
            cursor: pointer;
        }

        /* --- MASONRY GRID --- */
        .container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .masonry {
            column-count: 2;
            column-gap: 16px;
        }

        @media (min-width: 768px) { .masonry { column-count: 3; } }
        @media (min-width: 1200px) { .masonry { column-count: 5; } }

        .pin {
            break-inside: avoid;
            margin-bottom: 16px;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: var(--surface);
            transition: filter 0.2s;
            cursor: zoom-in;
        }

        .pin:hover { filter: brightness(1.1); }
        .pin img { width: 100%; display: block; }
        .pin-overlay { padding: 12px; }

        .pin-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-tag {
            font-size: 0.8rem;
            color: var(--text-sec);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .user-avatar-small {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        /* --- MODALS --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.show { display: flex; opacity: 1; }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 50;
        }

        .modal-box {
            background: var(--surface);
            border-radius: 32px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            position: relative;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* --- PIN DETAIL (PRO) --- */
        .pin-detail-box {
            display: flex;
            flex-direction: row;
            width: auto;
            max-width: 1000px;
            height: auto;
            max-height: 85vh;
            background: var(--surface);
            border-radius: 32px;
            position: relative;
            overflow: visible;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .pin-detail-img-wrapper {
            flex: 1 1 auto;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 300px;
            border-top-left-radius: 32px;
            border-bottom-left-radius: 32px;
            overflow: hidden;
        }

        .pin-detail-img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
        }

        .pin-detail-info {
            width: 350px;
            min-width: 300px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            text-align: left;
        }

        .pin-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 100;
        }

        .pin-detail-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .pin-detail-desc {
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .pin-detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
        }

        .tag-chip {
            background: #333;
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.85rem;
            color: #eee;
            cursor: pointer;
        }

        .btn-visit {
            background: #333;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 99px;
            font-weight: bold;
            display: block;
            text-align: center;
            margin-top: auto;
        }

        /* --- DROPDOWN --- */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 50px;
            left: 0;
            background: #2a2a2a;
            border-radius: 12px;
            padding: 8px;
            width: 180px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            z-index: 9999;
            flex-direction: column;
            border: 1px solid #444;
        }

        .dropdown-menu.show { display: flex; }

        .menu-item {
            background: none;
            border: none;
            color: white;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .menu-item:hover { background: #3a3a3a; }
        .menu-item.danger { color: #ff6b6b; }

        /* --- PROFILE --- */
        .profile-header { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: #333; object-fit: cover; }
        .profile-name { font-size: 1.5rem; font-weight: 800; margin: 0; }

        .stats-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 12px;
        }

        .stat-item { display: flex; flex-direction: column; }
        .stat-val { font-weight: 800; font-size: 1.1rem; }
        .stat-label { font-size: 0.75rem; color: var(--text-sec); text-transform: uppercase; }

        .btn-follow {
            background: white;
            color: black;
            border: none;
            padding: 10px 30px;
            border-radius: 99px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-follow.following {
            background: #333;
            color: white;
            border: 1px solid #555;
        }

        .profile-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-sec);
            font-weight: 600;
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: white;
            border-bottom-color: white;
        }

        .add-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #111;
            color: white;
            box-sizing: border-box;
        }

        /* --- ADMIN REPORTS --- */
        .report-card {
            background: #2a0a0a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        @media (max-width: 800px) {
            .pin-detail-box {
                flex-direction: column;
                width: 95%;
                height: 90vh;
                overflow-y: auto;
            }
            .pin-detail-img-wrapper {
                width: 100%;
                min-height: auto;
                border-radius: 0;
                background: transparent;
            }
            .pin-detail-img { max-height: 50vh; }
            .pin-detail-info { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo" onclick="resetFeed()">Limterest</div>
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Suchen...">
        </div>
        <div class="nav-actions">
            <!-- Admin Button (wird per JS eingeblendet, wenn Rechte da sind) -->
            <button class="btn-icon" id="btnAdminNav" style="display:none; background: #ff4444;" onclick="openAdminPanel()" title="Admin Panel">🛡️</button>
            <button class="btn-icon" onclick="openAddModal()">+</button>
            <button class="btn-primary" onclick="openMyProfile()">Profil</button>
        </div>
    </nav>

    <div class="container">
        <h2 id="page-title" style="margin-bottom: 20px; font-weight: 400; color: #aaa;">Entdecken</h2>
        <div id="grid" class="masonry"></div>
    </div>

    <!-- MODAL: PIN ERSTELLEN (Mit Cropper) -->
    <div id="modalAdd" class="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModals()">×</button>
            <h2>Pin erstellen</h2>
            <input type="text" id="inpTitle" class="add-input" placeholder="Titel">
            
            <input type="file" id="inpFile" class="add-input" accept="image/*" style="padding: 10px;" onchange="loadFile(event)">
            
            <div id="cropperContainer" style="display:none; width: 100%; max-height: 40vh; margin-bottom: 15px; overflow: hidden; border-radius: 12px;">
                <img id="imageToCrop" style="max-width: 100%; display: block;">
            </div>
            
            <input type="text" id="inpTags" class="add-input" placeholder="Tags (Komma getrennt)">
            <button class="btn-primary" id="btnPublish" style="width:100%" onclick="submitPin()">Zuschneiden & Veröffentlichen</button>
        </div>
    </div>

    <!-- MODAL: PROFIL -->
    <div id="modalProfile" class="modal">
        <div class="modal-box" style="max-width: 600px;">
            <button class="close-btn" onclick="closeModals()">×</button>
            <div class="profile-header">
                <img id="profAvatar" class="profile-avatar" src="">
                <h2 id="profName" class="profile-name">Username</h2>
                <p id="profBio" style="color:#888;">Bio...</p>
                <div class="stats-row">
                    <div class="stat-item"><span id="statPins" class="stat-val">0</span><span class="stat-label">Pins</span></div>
                    <div class="stat-item"><span id="statFollowers" class="stat-val">0</span><span class="stat-label">Follower</span></div>
                </div>
                <button id="btnFollow" class="btn-follow" onclick="toggleFollow()">Folgen</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

            <div id="profileTabs" class="profile-tabs" style="display:none;">
                <button class="tab-btn active" onclick="switchProfileTab('created')">Erstellt</button>
                <button class="tab-btn" onclick="switchProfileTab('saved')">Gemerkt</button>
            </div>

            <h3 id="profileGridTitle" style="text-align: left; margin-bottom: 15px;">Pins</h3>
            <div id="userPinGrid" class="masonry" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- MODAL: PIN DETAILS -->
    <div id="modalPinDetail" class="modal">
        <div class="modal-box pin-detail-box">
            <button class="close-btn" onclick="closeModals()" style="z-index: 20; background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px; top: 10px; right: 10px;">×</button>

            <div class="pin-detail-img-wrapper">
                <img id="detailImg" class="pin-detail-img" src="">
            </div>

            <div class="pin-detail-info">
                <div class="pin-detail-header">
                    <div style="display: flex; align-items: center; gap: 10px; position: relative;">
                        <button class="btn-icon" onclick="togglePinMenu()">•••</button>
                        <div id="pinMenu" class="dropdown-menu">
                            <!-- Wird via JavaScript befüllt -->
                        </div>
                    </div>
                    <button class="btn-primary" id="btnSave" onclick="saveCurrentPin()">Merken</button>
                </div>

                <div class="pin-detail-title" id="detailTitle">Titel</div>
                <p id="detailDesc" class="pin-detail-desc">Keine Beschreibung.</p>

                <div class="user-tag" id="detailUserTag" style="margin-bottom: 20px;">
                    <img id="detailUserAvatar" class="user-avatar-small" style="width: 40px; height: 40px;">
                    <span id="detailUsername" style="font-weight: bold; font-size: 1rem;">Username</span>
                </div>

                <div id="detailTags" class="pin-detail-tags"></div>
                <a id="detailLink" href="#" target="_blank" class="btn-visit">Original öffnen ↗</a>
            </div>
        </div>
    </div>

    <!-- MODAL: ADMIN PANEL -->
    <div id="modalAdmin" class="modal">
        <div class="modal-box" style="max-width: 800px; max-height: 80vh; overflow-y: auto; text-align: left;">
            <button class="close-btn" onclick="closeModals()">×</button>
            <h2 style="margin-top: 0; color: var(--danger);">🛡️ Admin Zentrale: Meldungen</h2>
            <p style="color: #aaa; margin-bottom: 20px;">Hier landen alle von Usern gemeldeten Pins. Du kannst sie überprüfen, löschen oder die Meldung verwerfen.</p>
            
            <div id="adminReportsList" style="display:flex; flex-direction:column;">
                <!-- Wird per JS befüllt -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.LIMO_API + '/api';

        let currentTargetUser = null;
        let currentOpenPin = null;
        let isOwnProfile = false; 
        let currentUser = null; 

        async function fetchAuth(url, options = {}) {
            const defaults = { credentials: 'include', headers: { 'Content-Type': 'application/json' } };
            return fetch(url, { ...defaults, ...options });
        }

        // --- INIT & AUTH ---
        async function initApp() {
            try {
                const res = await fetchAuth(`${API_BASE}/auth/me`);
                if (res.ok) {
                    currentUser = await res.json();
                    if (currentUser.isAdmin) {
                        document.getElementById('btnAdminNav').style.display = 'flex';
                    }
                }
            } catch (e) {}
            loadFeed();
        }

        // --- FEED ---
        async function loadFeed(query = '', username = '') {
            let url = `${API_BASE}/limterest/feed?`;
            if (query) url += `q=${encodeURIComponent(query)}&`;
            if (username) url += `username=${encodeURIComponent(username)}`;

            const titleEl = document.getElementById('page-title');
            if (username) titleEl.innerText = `Pins von @${username}`;
            else if (query) titleEl.innerText = `Suche: "${query}"`;
            else titleEl.innerText = "Entdecken";

            try {
                const res = await fetchAuth(url);
                const data = await res.json();
                renderGrid(data.pins, 'grid');
            } catch (e) { console.error(e); }
        }

        function renderGrid(pins, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (!pins || pins.length === 0) {
                container.innerHTML = '<div style="color:#555; width:100%; text-align:center;">Nichts gefunden.</div>';
                return;
            }
            pins.forEach(pin => {
                const div = document.createElement('div');
                div.className = 'pin';
                const pinDataString = encodeURIComponent(JSON.stringify(pin));
                const avatarUrl = `https://ui-avatars.com/api/?name=${pin.username}&background=random&color=fff`;

                div.innerHTML = `
                    <img src="${pin.imageUrl}" onclick="openPinDetail('${pinDataString}')" onerror="this.src='https://placehold.co/400x300?text=Fehler'">
                    <div class="pin-overlay">
                        <div class="pin-title">${pin.title}</div>
                        <div class="user-tag" onclick="openProfile('${pin.username}')">
                            <img src="${avatarUrl}" class="user-avatar-small">
                            <span>${pin.username}</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- PIN DETAIL ---
        async function openPinDetail(pinDataString, isRawObject = false) {
            try {
                const pin = isRawObject ? pinDataString : JSON.parse(decodeURIComponent(pinDataString));
                currentOpenPin = pin;

                document.getElementById('pinMenu').classList.remove('show');
                const btnSave = document.getElementById('btnSave');
                btnSave.innerText = "Lade...";
                btnSave.style.background = "";

                // Fill Data
                document.getElementById('detailImg').src = pin.imageUrl;
                document.getElementById('detailTitle').innerText = pin.title;
                document.getElementById('detailUsername').innerText = pin.username;
                document.getElementById('detailUserAvatar').src = `https://ui-avatars.com/api/?name=${pin.username}&background=random&color=fff`;
                document.getElementById('detailLink').href = pin.imageUrl;
                document.getElementById('detailDesc').innerText = pin.description || "Keine Beschreibung.";

                document.getElementById('detailUserTag').onclick = () => {
                    closeModals(); openProfile(pin.username);
                };

                const tagsContainer = document.getElementById('detailTags');
                tagsContainer.innerHTML = '';
                if (pin.tags) pin.tags.forEach(tag => {
                    const chip = document.createElement('span');
                    chip.className = 'tag-chip';
                    chip.innerText = "#" + tag;
                    chip.onclick = () => { closeModals(); loadFeed(tag); };
                    tagsContainer.appendChild(chip);
                });

                // Menü dynamisch aufbauen
                const isOwner = currentUser && currentUser.username === pin.username;
                const isAdmin = currentUser && currentUser.isAdmin;
                const menu = document.getElementById('pinMenu');
                
                menu.innerHTML = `
                    <button class="menu-item" onclick="shareCurrentPin()">🔗 Link kopieren</button>
                    <button class="menu-item" onclick="downloadCurrentPin()">💾 Bild speichern</button>
                    <button class="menu-item danger" onclick="reportPin()">🚩 Melden</button>
                `;
                
                if (isOwner || isAdmin) {
                    menu.innerHTML += `<button class="menu-item danger" onclick="deleteCurrentPin()">🗑️ Löschen</button>`;
                }

                // Zeige Modal
                // Verhindern, dass andere Modals offen bleiben (falls aus dem Admin Panel aufgerufen)
                document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
                document.getElementById('modalPinDetail').classList.add('show');

                // Check Status (Is Saved?)
                try {
                    const res = await fetchAuth(`${API_BASE}/limterest/pin/${pin._id}/is-saved`);
                    const data = await res.json();
                    if (data.isSaved) {
                        btnSave.innerText = "Gemerkt";
                        btnSave.style.background = "black";
                    } else {
                        btnSave.innerText = "Merken";
                        btnSave.style.background = "";
                    }
                } catch (e) { btnSave.innerText = "Merken"; }

            } catch (e) { console.error(e); }
        }

        async function saveCurrentPin() {
            if (!currentOpenPin) return;
            const btn = document.getElementById('btnSave');
            const originalText = btn.innerText;
            btn.innerText = "...";

            try {
                const res = await fetchAuth(`${API_BASE}/limterest/pin/${currentOpenPin._id}/save`, { method: 'POST' });
                const data = await res.json();
                if (data.isSaved) {
                    btn.innerText = "Gemerkt"; btn.style.background = "black";
                } else {
                    btn.innerText = "Merken"; btn.style.background = "";
                }
            } catch (e) {
                btn.innerText = originalText; alert("Fehler.");
            }
        }

        function shareCurrentPin() {
            if (!currentOpenPin) return;
            navigator.clipboard.writeText(currentOpenPin.imageUrl).then(() => {
                alert("Link kopiert!"); document.getElementById('pinMenu').classList.remove('show');
            });
        }

        function togglePinMenu() { document.getElementById('pinMenu').classList.toggle('show'); }
        
        function downloadCurrentPin() {
            if (currentOpenPin) window.open(currentOpenPin.imageUrl, '_blank');
        }

        // --- MELDEN & LÖSCHEN ---
        async function reportPin() {
            if (!currentOpenPin) return;
            const reason = prompt("Warum möchtest du diesen Pin melden? (Beleidigung, Spam, etc.)");
            if (!reason) return;

            try {
                const res = await fetchAuth(`${API_BASE}/limterest/pin/${currentOpenPin._id}/report`, {
                    method: 'POST',
                    body: JSON.stringify({ reason })
                });
                const data = await res.json();
                alert(data.message || data.error);
                document.getElementById('pinMenu').classList.remove('show');
            } catch (e) {
                alert("Netzwerkfehler.");
            }
        }

        async function deleteCurrentPin() {
            if (!currentOpenPin) return;
            if (!confirm("Diesen Pin wirklich unwiderruflich löschen?")) return;

            try {
                const res = await fetchAuth(`${API_BASE}/limterest/pin/${currentOpenPin._id}`, { method: 'DELETE' });
                const data = await res.json();
                
                if (res.ok) {
                    closeModals();
                    // Wenn wir uns auf dem eigenen Profil befinden, lade den Profil-Tab neu
                    if (document.getElementById('modalProfile').classList.contains('show')) {
                        switchProfileTab('created'); 
                    } else {
                        loadFeed();
                    }
                } else {
                    alert(data.error || "Fehler beim Löschen.");
                }
            } catch (e) {
                alert("Netzwerkfehler beim Löschen.");
            }
        }

        // --- ADMIN BEREICH ---
        async function openAdminPanel() {
            closeModals();
            const modal = document.getElementById('modalAdmin');
            const list = document.getElementById('adminReportsList');
            list.innerHTML = "<p>Lade Meldungen...</p>";
            modal.classList.add('show');

            try {
                const res = await fetchAuth(`${API_BASE}/limterest/admin/reports`);
                const data = await res.json();
                
                if (!res.ok) throw new Error("Fehler");
                
                list.innerHTML = "";
                if (data.reports.length === 0) {
                    list.innerHTML = "<p style='color:#777;'>Keine anstehenden Meldungen.</p>";
                    return;
                }

                data.reports.forEach(r => {
                    list.innerHTML += `
                        <div class="report-card" id="rep-${r._id}">
                            <div>
                                <div style="color: #ff4444; font-weight: bold; margin-bottom: 5px;">Meldung von: ${r.reportedBy}</div>
                                <div style="font-size: 14px; margin-bottom: 10px;">Grund: ${r.reason}</div>
                                <div style="color: #aaa; font-size: 12px;">Pin ID: ${r.pinId}</div>
                            </div>
                            <div style="display: flex; gap: 10px; flex-direction: column;">
                                <button class="btn-primary" style="background:#555;" onclick="loadAndPreviewPin('${r.pinId}')">Pin ansehen</button>
                                <button class="btn-primary" style="background:#222; color:#aaa; border: 1px solid #555;" onclick="dismissReport('${r._id}')">Verwerfen</button>
                                <button class="btn-danger" onclick="deletePinFromReport('${r.pinId}', '${r._id}')">Pin Löschen</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                list.innerHTML = "<p style='color:var(--danger)'>Fehler beim Laden des Admin Panels.</p>";
            }
        }

        // Hilfsfunktion: Lädt den Pin aus dem Feed (damit der Admin ihn im Detail-Modal sieht)
        async function loadAndPreviewPin(pinId) {
            try {
                const res = await fetchAuth(`${API_BASE}/limterest/feed`);
                const data = await res.json();
                const pin = data.pins.find(p => p._id === pinId);
                
                if (pin) {
                    openPinDetail(pin, true); // Übergibt das rohe Objekt, keinen String
                } else {
                    alert("Pin nicht in den ersten 50 Ergebnissen gefunden. (Die API bräuchte eine direkte Fetch-Route).");
                }
            } catch (e) { alert("Fehler beim Prüfen."); }
        }

        async function dismissReport(reportId) {
            if (!confirm("Meldung verwerfen? Der Pin bleibt online.")) return;
            try {
                const res = await fetchAuth(`${API_BASE}/limterest/admin/reports/${reportId}`, { method: 'DELETE' });
                if (res.ok) {
                    document.getElementById(`rep-${reportId}`).remove();
                } else {
                    alert("Fehler beim Verwerfen.");
                }
            } catch (e) { alert("Netzwerkfehler."); }
        }

        async function deletePinFromReport(pinId, reportId) {
            if (!confirm("Den Pin wirklich komplett aus der Datenbank löschen?")) return;
            try {
                const res = await fetchAuth(`${API_BASE}/limterest/pin/${pinId}`, { method: 'DELETE' });
                if (res.ok) {
                    document.getElementById(`rep-${reportId}`).remove();
                    alert("Pin und alle dazugehörigen Reports wurden gelöscht.");
                } else {
                    alert("Fehler beim Löschen des Pins.");
                }
            } catch (e) { alert("Netzwerkfehler."); }
        }

        // --- PROFILE & TABS ---
        async function openProfile(username) {
            currentTargetUser = username;
            isOwnProfile = false;

            const modal = document.getElementById('modalProfile');
            const grid = document.getElementById('userPinGrid');
            const tabs = document.getElementById('profileTabs');

            grid.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">Lade...</div>';
            modal.classList.add('show');
            tabs.style.display = 'none';

            try {
                if (currentUser && currentUser.username === username) {
                    isOwnProfile = true;
                    tabs.style.display = 'flex';
                    document.getElementById('btnFollow').style.display = 'none'; 
                } else {
                    document.getElementById('btnFollow').style.display = 'inline-block';
                }

                const res = await fetchAuth(`${API_BASE}/limterest/user/${username}`);
                const data = await res.json();

                document.getElementById('profName').innerText = data.username;
                document.getElementById('profBio').innerText = data.bio;
                document.getElementById('statPins').innerText = data.stats.pins;
                document.getElementById('statFollowers').innerText = data.stats.followers;
                document.getElementById('profAvatar').src = `https://ui-avatars.com/api/?name=${data.username}&size=200&background=random`;

                const btn = document.getElementById('btnFollow');
                if (data.isFollowing) {
                    btn.innerText = "Abonniert"; btn.classList.add('following');
                } else {
                    btn.innerText = "Abonnieren"; btn.classList.remove('following');
                }

                switchProfileTab('created');
            } catch (e) { grid.innerHTML = 'Fehler beim Laden.'; }
        }

        async function switchProfileTab(tab) {
            const btns = document.querySelectorAll('.profile-tabs .tab-btn');
            btns.forEach(b => b.classList.remove('active'));
            if (tab === 'created') btns[0].classList.add('active');
            else btns[1].classList.add('active');

            const grid = document.getElementById('userPinGrid');
            grid.innerHTML = 'Lade...';

            if (tab === 'created') {
                document.getElementById('profileGridTitle').innerText = "Erstellte Pins";
                const res = await fetchAuth(`${API_BASE}/limterest/feed?username=${encodeURIComponent(currentTargetUser)}`);
                const data = await res.json();
                renderGrid(data.pins, 'userPinGrid');
            } else if (tab === 'saved') {
                document.getElementById('profileGridTitle').innerText = "Gemerkte Pins (Geheim)";
                const res = await fetchAuth(`${API_BASE}/limterest/my-saved`);
                const data = await res.json();
                renderGrid(data.pins, 'userPinGrid');
            }
        }

        async function toggleFollow() {
            if (!currentTargetUser) return;
            try {
                const res = await fetchAuth(`${API_BASE}/limterest/user/${currentTargetUser}/follow`, { method: 'POST' });
                const data = await res.json();
                const btn = document.getElementById('btnFollow');
                let count = parseInt(document.getElementById('statFollowers').innerText);
                if (data.isFollowing) {
                    btn.innerText = "Abonniert"; btn.classList.add('following');
                    document.getElementById('statFollowers').innerText = count + 1;
                } else {
                    btn.innerText = "Abonnieren"; btn.classList.remove('following');
                    document.getElementById('statFollowers').innerText = Math.max(0, count - 1);
                }
            } catch (e) { alert("Fehler."); }
        }

        async function openMyProfile() {
            if (currentUser) {
                openProfile(currentUser.username);
            } else {
                alert("Du bist nicht eingeloggt.");
            }
        }

        // --- CROPPER UPLOAD HELPERS ---
        let cropper = null;

        function openAddModal() { 
            document.getElementById('modalAdd').classList.add('show'); 
        }

        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('imageToCrop');
                img.src = e.target.result;
                document.getElementById('cropperContainer').style.display = 'block';

                if (cropper) cropper.destroy();
                
                cropper = new Cropper(img, {
                    viewMode: 2,
                    background: false,
                    autoCropArea: 1,
                });
            }
            reader.readAsDataURL(file);
        }

        async function submitPin() {
            const title = document.getElementById('inpTitle').value;
            const tags = document.getElementById('inpTags').value;
            const btn = document.getElementById('btnPublish');

            if (!cropper) return alert("Bitte wähle ein Bild aus!");
            if (!title) return alert("Ein Titel ist erforderlich!");

            btn.innerText = "Lädt hoch...";
            btn.disabled = true;

            try {
                cropper.getCroppedCanvas().toBlob(async (blob) => {
                    if (!blob) {
                        btn.innerText = "Zuschneiden & Veröffentlichen";
                        btn.disabled = false;
                        return alert("Fehler beim Zuschneiden des Bildes.");
                    }

                    const formData = new FormData();
                    formData.append('image', blob, 'limterest.jpg');

                    const uploadRes = await fetch(`${window.LIMO_API}/api/cdn/upload`, {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'
                    });

                    const uploadData = await uploadRes.json();
                    if (!uploadRes.ok) {
                        btn.innerText = "Zuschneiden & Veröffentlichen";
                        btn.disabled = false;
                        return alert(uploadData.error || "Fehler beim Upload auf das CDN.");
                    }

                    const finalImageUrl = uploadData.url;

                    const res = await fetchAuth(`${API_BASE}/limterest/pin`, {
                        method: 'POST', 
                        body: JSON.stringify({ title, imageUrl: finalImageUrl, tags })
                    });
                    
                    if (res.ok) { 
                        closeModals(); 
                        loadFeed(); 
                    } else { 
                        alert("Fehler beim Speichern des Pins."); 
                    }
                    
                    btn.innerText = "Zuschneiden & Veröffentlichen";
                    btn.disabled = false;

                }, 'image/jpeg', 0.9);
                
            } catch (e) { 
                alert("Netzwerkfehler"); 
                btn.innerText = "Zuschneiden & Veröffentlichen";
                btn.disabled = false;
            }
        }

        function closeModals() { 
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); 
            if (cropper) {
                cropper.destroy();
                cropper = null;
                document.getElementById('cropperContainer').style.display = 'none';
                document.getElementById('inpFile').value = "";
                document.getElementById('inpTitle').value = "";
                document.getElementById('inpTags').value = "";
            }
        }

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadFeed(searchInput.value); });
        function resetFeed() { searchInput.value = ''; loadFeed(); }

        window.onclick = function (event) {
            if (!event.target.closest('.btn-icon') && !event.target.closest('.dropdown-menu')) {
                const pinMenu = document.getElementById('pinMenu');
                if (pinMenu) pinMenu.classList.remove('show');
            }
        }

        // App starten!
        initApp();
    </script>
</body>
</html>
